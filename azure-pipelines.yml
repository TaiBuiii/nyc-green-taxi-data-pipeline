trigger:
  branches:
    include:
      - main

variables:
  - group: prod-variables # Gọi Key Vault chứa token/secret

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Deploy_Databricks
    displayName: 'Deploy Spark Code to Databricks'
    jobs:
      - job: PushToDatabricks
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.9'
          - script: |
              pip install databricks-cli
              databricks configure --token <<EOF
              $(DATABRICKS-HOST)
              $(DATABRICKS-TOKEN)
              EOF
              databricks workspace import_dir ./databricks/src /Shared/production_code -e
            displayName: 'Sync Spark scripts to Databricks workspace'

  - stage: Deploy_ADF
    displayName: 'Deploy ADF via ARM Template'
    dependsOn: Deploy_Databricks
    jobs:
      - job: PublishADF
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: 'Azure for Students'
              subscriptionId: '$(AZURE-SUBSCRIPTION-ID)'
              action: 'Create Or Update Resource Group'
              resourceGroupName: 'rg-nyc-green-taxi'
              location: 'East US'
              templateLocation: 'Linked artifact'
              csmFile: '$(System.DefaultWorkingDirectory)/adf_publish/ARMTemplateForFactory.json'
              csmParametersFile: '$(System.DefaultWorkingDirectory)/adf_publish/ARMTemplateParametersForFactory.json'
              overrideParameters: '-factoryName adf-nyc-green-taxi'
              deploymentMode: 'Incremental'